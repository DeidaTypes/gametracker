<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset your password | Checkpoint</title>
  <meta name="description" content="Finish resetting your Checkpoint password in the app.">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="icon.png" alt="" width="32" height="32">Checkpoint</a>
  </header>

  <main class="page page--center">
    <img class="landing-icon" src="icon.png" alt="" width="96" height="96">
    <h1 data-reset-heading>Reset your password</h1>
    <p class="lede" data-reset-note>Open Checkpoint on this iPhone to choose a new password.</p>
    <div class="actions">
      <a class="btn btn--primary" data-reset-open href="#" hidden>Open Checkpoint</a>
    </div>
  </main>

  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="support.html">Support</a>
    </nav>
    <div>&copy; Checkpoint</div>
  </footer>

  <script src="site-config.js"></script>
  <script src="site.js"></script>
  <script>
    /*
     * The reset email links here with the recovery tokens in the fragment
     * (#access_token=…&refresh_token=…&type=recovery). This page never shows
     * them. It hands them to the app as checkpoint://reset-password#…, which
     * services/appLifecycle.js turns into a recovery session, then removes
     * them from the address bar.
     */
    ;(function () {
      var hash = window.location.hash || ''
      var params = new URLSearchParams(hash.replace(/^#/, ''))
      var heading = document.querySelector('[data-reset-heading]')
      var note = document.querySelector('[data-reset-note]')
      var open = document.querySelector('[data-reset-open]')

      if (hash) {
        try {
          history.replaceState(null, '', window.location.pathname)
        } catch (e) {}
      }

      if (params.get('error') || params.get('error_code')) {
        heading.textContent = 'This link has expired'
        note.textContent =
          'Reset links work once and only for a short time. In Checkpoint, tap Log In, then Forgot password, to get a new one.'
        return
      }

      if (!params.get('access_token') || !params.get('refresh_token')) {
        heading.textContent = 'This link is incomplete'
        note.textContent =
          'Open the newest reset email and tap its link again, or request a new one in Checkpoint: Log In, then Forgot password.'
        return
      }

      open.setAttribute('href', 'checkpoint://reset-password' + hash)
      open.hidden = false
    })()
  </script>
</body>
</html>
