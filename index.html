<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Track your video games, write reviews, and discover new titles. Your personal game library." />

    <meta property="og:type"        content="website" />

    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@gametracker" />
    <meta name="twitter:title"       content="Checkpoint — Your Video Game Library" />
    <meta name="twitter:description" content="Track what you play, write reviews, and discover new titles." />
    <meta name="twitter:image"       content="https://gametracker.app/og-default.png" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Checkpoint" />

    <!-- Android Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" href="/icon-192.png" />
