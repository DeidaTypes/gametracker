<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Track your video games, write reviews, and discover new titles. Your personal game library." />
    <meta name="theme-color" content="#0a0f1f" />
    <!-- The mascot and both wordmarks, ready on frame one: the opening splash uses them. -->
    <link rel="preload" as="image" href="/brand/checkpoint-splash-1x.png"
          imagesrcset="/brand/checkpoint-splash-1x.png 1x, /brand/checkpoint-splash-2x.png 2x, /brand/checkpoint-splash-3x.png 3x" />
    <link rel="preload" as="image" href="/brand/checkpoint-wordmark-dark-1x.png"
          imagesrcset="/brand/checkpoint-wordmark-dark-1x.png 1x, /brand/checkpoint-wordmark-dark-2x.png 2x, /brand/checkpoint-wordmark-dark-3x.png 3x" />
    <link rel="preload" as="image" href="/brand/checkpoint-wordmark-light-1x.png"
          imagesrcset="/brand/checkpoint-wordmark-light-1x.png 1x, /brand/checkpoint-wordmark-light-2x.png 2x, /brand/checkpoint-wordmark-light-3x.png 3x" />
    <!-- First-frame theme and opening splash. This file is the one place that
         runs before theme.css, so it is the one exception to "no literal
         colors or curves". Every literal below says which token it equals. -->
    <style id="theme-boot">
      /* The #0a0f1f fallback = LaunchBackground (navy); --boot-bg is the saved theme's base. */
      html, body, #root { background-color: var(--boot-bg, #0a0f1f); color-scheme: dark; }
      html[data-app-theme="light"],
      html[data-app-theme="sky"],
      html[data-app-theme="pink"],
      html[data-app-theme="cream"],
      html[data-app-theme="lavender"],
      html[data-app-theme="sage"],
      html[data-app-theme="lemonade"],
      html[data-app-theme="paper"] { color-scheme: light; }

      /* Opening splash. src/motion/bootSplash.js hands it off once the app
         has something to show. Covers everything and blocks taps until then.
         It is transparent itself: the launch color is the .boot-cover layer
         inside it, painted in the saved theme's base to match the repainted
         iOS launch image, while the app underneath (html, body, #root above)
         is already in that theme. .boot-brand is the mascot and wordmark,
         centered on the full screen where the storyboard put them. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: transparent;
      }
      /* The iOS launch image's color: the saved theme's base. Never animated
         here: bootSplash.js fades it only when the sign-in mascot glides into
         its page. */
      #boot-splash .boot-cover {
        position: absolute;
        inset: 0;
        opacity: 1;
        /* The saved theme's base: the same color the iOS launch image was repainted
           in (LaunchScreenCache.swift). --boot-bg is dropped by applyTheme(), so
           the cover falls back to --theme-base, which is that same base. */
        background-color: var(--boot-bg, var(--theme-base));
      }
      /* LaunchLogo + wordmark, centered on the full screen (not the safe
         area). Mascot is aspect-fit at 84pt (the 51x84 box), then 16px
         (= --space-16), then the wordmark at 159x32. The group is 132pt,
         so the mascot's center is 24pt above the screen center and the
         wordmark's center is 50pt below — LaunchScreen.storyboard. */
      #boot-splash .boot-brand {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #boot-splash .boot-brand > img:first-child {
        position: relative;
        display: block;
        width: auto;
        height: 84px;
        margin-bottom: 16px; /* = --space-16 */
        max-width: none;
        will-change: transform, opacity;
      }
      #boot-splash .boot-wm {
        position: relative;
        display: block;
        width: 159px;
        height: 32px;
        max-width: none;
        will-change: transform, opacity;
      }
      /* checkpoint-wordmark-dark is light text for dark themes; -light is
         dark ink. Only the one for data-boot-scheme is shown. Navy (no
         scheme yet) keeps the light text. */
      #boot-splash .boot-wm--light {
        display: none;
      }
      html[data-boot-scheme="dark"] #boot-splash .boot-wm--light,
      html[data-boot-scheme="light"] #boot-splash .boot-wm--dark {
        display: none;
      }
      html[data-boot-scheme="light"] #boot-splash .boot-wm--light {
        display: block;
      }
    </style>
    <script>
      (function () {
        var KEY = 'gametracker.theme.v1'
        // Theme bases. These MUST equal the `base` of each theme in
        // src/styles/themePreview.js (and --theme-base in theme.css). If they
        // drift, that theme changes color twice on open: here, then in theme.css.
        var BG = {
          navy: '#0a0f1f',
          black: '#000000',
          forest: '#08140f',
          purple: '#110a1d',
          ocean: '#061619',
          arcade: '#05060f',
          volt: '#0b0c0a',
          cherry: '#15070d',
          light: '#f4f6fa',
          sky: '#cfe2f6',
          pink: '#f5d3de',
          cream: '#e8dcc2',
          lavender: '#e7e1f5',
          sage: '#dde6d8',
          lemonade: '#faf1a2',
          paper: '#f3f1ec'
        }
        // The same eight ids as LaunchScreenCache.lightThemeIds. They get
        // the dark-ink wordmark; every other theme gets the light one.
        var LIGHT = {
          light: 1,
          sky: 1,
          pink: 1,
          cream: 1,
          lavender: 1,
          sage: 1,
          lemonade: 1,
          paper: 1
        }
        var theme = 'navy'
        try {
          var stored = JSON.parse(localStorage.getItem(KEY) || 'null')
          if (stored && typeof stored === 'object') {
            if (stored.matchSystem === true) {
              var dark = false
              try {
                dark = window.matchMedia('(prefers-color-scheme: dark)').matches
              } catch (e) {}
              var pick = dark ? stored.lastDark : stored.lastLight
              if (BG[pick]) theme = pick
            } else if (BG[stored.theme]) {
              theme = stored.theme
            }
          }
        } catch (e) {}
        var root = document.documentElement
        root.setAttribute('data-app-theme', theme)
        root.setAttribute('data-boot-scheme', LIGHT[theme] ? 'light' : 'dark')
        root.style.setProperty('--boot-bg', BG[theme])
        // bootSplash.js clears this when the splash is gone; the CSS that holds
        // sign-in content back is keyed on it, so nothing can stay hidden.
        root.setAttribute('data-boot', '')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', BG[theme])
        // Tell the iOS shell the saved theme on every launch, so its launch
        // image is repainted in this base (ViewController.swift). No-op in a browser.
        try {
          var cp = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.cpTheme
          if (cp) cp.postMessage({ id: theme, base: BG[theme] })
        } catch (e) {}
      })()
    </script>

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Checkpoint" />
    <meta property="og:title"       content="Checkpoint — Your Video Game Library" />
    <meta property="og:description" content="Track what you play, write reviews, and discover new titles." />
    <meta property="og:url"         content="https://gametracker.app" />
    <meta property="og:image"       content="https://gametracker.app/og-default.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@gametracker" />
    <meta name="twitter:title"       content="Checkpoint — Your Video Game Library" />
    <meta name="twitter:description" content="Track what you play, write reviews, and discover new titles." />
    <meta name="twitter:image"       content="https://gametracker.app/og-default.png" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Checkpoint" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Android Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <title>Checkpoint - Your Video Game Library</title>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-cover"></div>
      <div class="boot-brand">
        <img
          src="/brand/checkpoint-splash-1x.png"
          srcset="/brand/checkpoint-splash-1x.png 1x, /brand/checkpoint-splash-2x.png 2x, /brand/checkpoint-splash-3x.png 3x"
          width="157"
          height="260"
          alt=""
          draggable="false"
        />
        <img
          class="boot-wm boot-wm--dark"
          src="/brand/checkpoint-wordmark-dark-1x.png"
          srcset="/brand/checkpoint-wordmark-dark-1x.png 1x, /brand/checkpoint-wordmark-dark-2x.png 2x, /brand/checkpoint-wordmark-dark-3x.png 3x"
          width="159"
          height="32"
          alt=""
          draggable="false"
        />
        <img
          class="boot-wm boot-wm--light"
          src="/brand/checkpoint-wordmark-light-1x.png"
          srcset="/brand/checkpoint-wordmark-light-1x.png 1x, /brand/checkpoint-wordmark-light-2x.png 2x, /brand/checkpoint-wordmark-light-3x.png 3x"
          width="159"
          height="32"
          alt=""
          draggable="false"
        />
      </div>
    </div>
    <script>
      // The mascot and the visible wordmark have decoded and two frames have
      // painted: the splash is on screen, identical to the iOS launch screen.
      // Tell the native launch cover it can go (ViewController.swift) and let
      // bootSplash.js start its hand-off no sooner than a beat after this. In
      // a desktop browser there is no native handler; only the timestamp is set.
      (function () {
        var splash = document.getElementById('boot-splash')
        var mascot = splash && splash.querySelector('.boot-brand > img:first-child')
        if (!mascot) return
        var scheme = document.documentElement.getAttribute('data-boot-scheme')
        var wordmark = splash.querySelector(scheme === 'light' ? '.boot-wm--light' : '.boot-wm--dark')
        var pending = wordmark ? 2 : 1
        var sent = false
        function ready() {
          pending -= 1
          if (pending > 0 || sent) return
          sent = true
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              window.__cpSplashReadyAt = performance.now()
              try {
                var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bootCover
                if (h) h.postMessage('ready')
              } catch (e) {}
            })
          })
        }
        function watch(img) {
          if (!img) return
          var settled = false
          function one() {
            if (settled) return
            settled = true
            ready()
          }
          if (img.decode) img.decode().then(one, one)
          else if (img.complete) one()
          else {
            img.addEventListener('load', one)
            img.addEventListener('error', one)
          }
        }
        watch(mascot)
        watch(wordmark)
      })()
    </script>
    <script>
      (function () {
        var splash = document.getElementById('boot-splash')
        if (!splash) return
        // Failsafe: if nothing has handed the splash off after 8s (a hung
        // session restore, an error screen), fade it out and remove it.
        setTimeout(function () {
          var el = document.getElementById('boot-splash')
          if (!el) return
          el.style.pointerEvents = 'none'
          el.style.transition = 'opacity 200ms cubic-bezier(0.25, 0.1, 0.25, 1)' // = --ease-fade
          el.style.opacity = '0'
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el)
            document.documentElement.removeAttribute('data-boot')
          }, 200)
        }, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
